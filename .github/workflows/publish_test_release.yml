name: Publish test installers as a pre-release

# Copies the installers built by a previous "Build installers (branches)" run
# into a GitHub pre-release, so they can be downloaded with a plain link.
on:
  push:
    branches:
      - feat/basic-auth
    paths:
      - .github/workflows/publish_test_release.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download installers from the branch build
        uses: actions/download-artifact@v8
        with:
          name: installers
          path: ./installers
          run-id: 45877380052
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create pre-release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: basic-auth-test
          target_commitish: ${{ github.sha }}
          name: Basic Auth test build
          prerelease: true
          body: Test build of the feat/basic-auth branch (Basic Auth with UID/PWD). Not an official release.
          files: |
            installers/TrinoODBC_x64.msi
            installers/TrinoODBC_x86.msi

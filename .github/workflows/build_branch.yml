name: Build installers (branches)

# Builds the MSI installers for any branch other than main, so a change can be
# installed and tested on Windows without cutting a release. The installers are
# available as the "installers" artifact of the workflow run, and the
# feat/basic-auth branch also publishes them as the "basic-auth-test"
# pre-release so they can be downloaded with a plain link.
on:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022

    env:
      WIX_VERSION: "5.0.2"

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Get CMake
        uses: lukka/get-cmake@latest

      - name: Run vcpkg
        uses: lukka/run-vcpkg@v11
        
      - name: Run CMake and build x86
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x86
          cmake --preset x86-release
          cmake --build --preset x86-release

      - name: Run CMake and build x64
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          cmake --preset x64-release
          cmake --build --preset x64-release

      - name: Add dotnet tool cli
        uses: actions/setup-dotnet@v5

      - name: Add WiX dotnet package
        run: |
          dotnet tool install --global wix --version ${{ env.WIX_VERSION }}

      - name: Add WiX UI extension
        run: |
         wix extension add -g WixToolset.UI.wixext/${{ env.WIX_VERSION }}

      - name: Build x86 installer
        shell: pwsh
        run: |
          .\install\build_x86_installer.ps1

      - name: Build x64 installer
        shell: pwsh
        run: |
          .\install\build_x64_installer.ps1

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: installers
          if-no-files-found: error
          overwrite: true
          retention-days: 14
          path: |
            install/TrinoODBC_x86.msi
            install/TrinoODBC_x64.msi
            install/LICENSE.rtf
            install/third_party_licenses.txt

  publish-test-release:
    if: github.ref == 'refs/heads/feat/basic-auth'
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: installers
          path: ./installers

      - name: Remove the previous test pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete basic-auth-test --cleanup-tag -y -R "$GITHUB_REPOSITORY" || true

      - name: Create test pre-release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: basic-auth-test
          target_commitish: ${{ github.sha }}
          name: Basic Auth test build
          prerelease: true
          body: Test build of the feat/basic-auth branch (Basic Auth with UID/PWD, Test Connection button). Not an official release.
          files: |
            installers/TrinoODBC_x64.msi
            installers/TrinoODBC_x86.msi
